<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortaPottyPics — Art from the loo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1113; --card:#171b1e; --line:rgba(244,239,228,.09); --line-hi:rgba(244,239,228,.22);
    --paper:#f4efe4; --muted:rgba(244,239,228,.5); --potty:#39a8c6; --heart:#ef6f6c; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--paper);font-family:'Permanent Marker',system-ui,cursive;-webkit-font-smoothing:antialiased;line-height:1.4;min-height:100vh}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.9rem;padding:.85rem 1.1rem;background:rgba(14,17,19,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-size:1.4rem;letter-spacing:.5px;line-height:1;white-space:nowrap}
  .brand span{color:var(--potty)}
  .tag{font-size:.72rem;color:var(--muted);line-height:1;margin-top:.25rem;display:none}
  @media(min-width:560px){ .tag{display:inline} }

  .submit-btn{margin-left:auto;background:var(--potty);color:#06262e;text-decoration:none;font-size:.9rem;padding:.5rem .85rem;border-radius:10px;white-space:nowrap;transition:opacity .15s ease}
  .submit-btn:hover{opacity:.85}

  main{padding:1.4rem 1.1rem 3rem;max-width:1180px;margin:0 auto}
  .lede{font-size:.95rem;color:var(--muted);margin:0 .15rem 1.3rem;max-width:34ch}

  .feed{column-count:1;column-gap:16px}
  @media(min-width:640px){ .feed{column-count:2} }
  @media(min-width:1000px){ .feed{column-count:3} }

  .post{break-inside:avoid;width:100%;display:inline-block;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .18s ease,border-color .18s ease}
  .post:hover{transform:translateY(-3px);border-color:var(--line-hi)}
  .art{display:block;width:100%;height:auto}
  .body{padding:.75rem .9rem .85rem}
  .caption{font-size:1.04rem;line-height:1.3;margin-bottom:.55rem}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem .55rem;font-size:.72rem;color:var(--muted)}
  .meta .loc{color:var(--potty)}
  .meta .dot{opacity:.4}

  [hidden]{display:none!important}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem}
  .row .meta{flex:1;min-width:0}
  .like{flex:none;display:inline-flex;align-items:center;gap:.35rem;background:transparent;border:1px solid var(--line-hi);color:var(--muted);font:inherit;font-size:.8rem;line-height:1;padding:.4rem .65rem;border-radius:999px;cursor:pointer;transition:color .15s ease,border-color .15s ease,transform .12s ease}
  .like svg{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  .like:hover{color:var(--paper);border-color:var(--paper)}
  .like:active{transform:scale(.94)}
  .like.liked{color:var(--heart);border-color:var(--heart);cursor:default}
  .like.liked svg{fill:currentColor}
  .like.pop svg{animation:pop .35s ease}
  @keyframes pop{40%{transform:scale(1.35)}}
  @media(prefers-reduced-motion:reduce){ .like.pop svg{animation:none} .post{transition:none} }

  .spotlight{margin:0 0 1.6rem}
  .spot-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin:0 .15rem .7rem}
  .spot-badge{font-size:1.15rem;color:var(--potty)}
  .spot-tabs{display:flex;gap:.3rem}
  .spot-tabs button{background:transparent;border:1px solid var(--line-hi);color:var(--muted);font:inherit;font-size:.78rem;padding:.35rem .7rem;border-radius:999px;cursor:pointer}
  .spot-tabs button.on{background:var(--potty);border-color:var(--potty);color:#06262e}
  .spotlight .post{display:block;margin:0;border-color:var(--potty);box-shadow:0 0 0 1px var(--potty) inset}
  .spotlight .post:hover{transform:none}
  .spotlight .art{max-height:70vh;object-fit:contain;background:#0b0d0f}
  .spotlight .caption{font-size:1.3rem}

  .state{text-align:center;color:var(--muted);font-size:1rem;padding:3rem 1rem;line-height:1.6}
  .state.err{color:#e09a9a}

  footer{border-top:1px solid var(--line);padding:1.6rem 1.1rem 2.4rem;text-align:center;color:var(--muted);font-size:.8rem}
  footer .fbrand{color:var(--paper);font-size:1.05rem}
  footer .fbrand span{color:var(--potty)}
</style>
</head>
<body>

<header>
  <div class="brand">PortaPotty<span>Pics</span></div>
  <div class="tag">Art from the loo</div>
  <a class="submit-btn" href="/submit.html">Submit a Find</a>
</header>

<main>
  <section class="spotlight" id="spotlight" hidden>
    <div class="spot-head">
      <span class="spot-badge" id="spotBadge">🏆 Photo of the Week</span>
      <div class="spot-tabs" id="spotTabs" hidden>
        <button type="button" data-period="week" class="on">Week</button>
        <button type="button" data-period="month">Month</button>
      </div>
    </div>
    <div id="spotCard"></div>
  </section>

  <p class="lede">The latest artwork found inside porta potties around the world. Freshest finds up top.</p>
  <div id="state" class="state">Loading the latest finds…</div>
  <div class="feed" id="feed"></div>
</main>

<footer>
  <div class="fbrand">PortaPotty<span>Pics</span></div>
  <p>The world's loo, curated.</p>
</footer>

<script>
  /* ===================================================================
     ⚙️  EDIT THIS ONE LINE: your Strapi address.
     - Testing locally?  'http://localhost:1337'
     - Deployed?         'https://your-strapi-domain.com'
     No trailing slash.
  =================================================================== */
  const STRAPI_URL = 'https://portapottypics-production.up.railway.app';
  /* =================================================================== */

  const feed = document.getElementById('feed');
  const stateEl = document.getElementById('state');

  function setState(msg, isErr){ stateEl.textContent = msg; stateEl.className = 'state' + (isErr ? ' err' : ''); stateEl.style.display = 'block'; }
  function clearState(){ stateEl.style.display = 'none'; }

  // Pick the best image URL for the feed.
  // Prefers the "medium" rendition (smaller, faster) and falls back to the
  // original. Photo URLs are absolute when stored in a bucket (S3/R2), or
  // relative when on Strapi's local disk — so only prepend STRAPI_URL when relative.
  function imgUrl(photo){
    if(!photo) return '';
    const candidate =
      (photo.formats && photo.formats.medium && photo.formats.medium.url) ||
      (photo.formats && photo.formats.small && photo.formats.small.url) ||
      photo.url;
    if(!candidate) return '';
    return candidate.startsWith('http') ? candidate : STRAPI_URL + candidate;
  }

  function relTime(iso){
    if(!iso) return '';
    const s = Math.max(1, Math.round((Date.now() - new Date(iso).getTime())/1000));
    if(s < 60) return 'just now';
    const m = Math.round(s/60); if(m < 60) return m + 'm';
    const h = Math.round(m/60); if(h < 24) return h + 'h';
    const d = Math.round(h/24); if(d < 7) return d + 'd';
    return Math.round(d/7) + 'w';
  }

  function makeCard(find){
    const art = document.createElement('article'); art.className = 'post';
    const src = imgUrl(find.photo);
    const body = document.createElement('div'); body.className = 'body';
    const cap = document.createElement('p'); cap.className = 'caption'; cap.textContent = find.caption || '';
    const meta = document.createElement('div'); meta.className = 'meta';
    if(find.location){ const loc = document.createElement('span'); loc.className = 'loc'; loc.textContent = '📍 ' + find.location; meta.appendChild(loc); meta.appendChild(dot()); }
    const who = document.createElement('span'); who.textContent = find.submitter || 'anon'; meta.appendChild(who);
    meta.appendChild(dot());
    const when = document.createElement('span'); when.textContent = relTime(find.publishedAt); meta.appendChild(when);
    const row = document.createElement('div'); row.className = 'row';
    row.append(meta);
    if(find.documentId){ row.append(makeLikeButton(find)); }
    body.append(cap, row);

    // Only add an <img> if we actually have a source, so a missing photo
    // doesn't render a broken-image icon.
    if(src){
      const img = document.createElement('img'); img.className = 'art'; img.loading = 'lazy';
      img.src = src;
      img.alt = 'Porta potty find' + (find.location ? ' from ' + find.location : '');
      art.append(img);
    }
    art.append(body);
    return art;
  }
  function dot(){ const d = document.createElement('span'); d.className = 'dot'; d.textContent = '·'; return d; }

  /* ---------------------------------------------------------------
     Likes — one per browser per photo.
     A random id for this browser and the list of photos it has liked
     live in localStorage. The server also checks the id, so a repeat
     tap (or a second tab) can't add a second like.
  --------------------------------------------------------------- */
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 2.8 4.5 6.6 4.5c2.1 0 3.9 1.2 5.4 3.1 1.5-1.9 3.3-3.1 5.4-3.1 3.8 0 5.7 4 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>';

  function store(key, value){
    try{
      if(value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    }catch(e){ return null; }
  }
  function voterId(){
    let id = store('ppp_voter');
    if(!id || !/^[A-Za-z0-9-]{16,64}$/.test(id)){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
         : 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
      store('ppp_voter', id);
    }
    return id;
  }
  let likedIds;
  try{ likedIds = new Set(JSON.parse(store('ppp_liked') || '[]')); }catch(e){ likedIds = new Set(); }
  const likeCounts = {};   // documentId -> latest known count (keeps the card and spotlight in sync)

  function paintLike(id){
    document.querySelectorAll('.like[data-id="' + id + '"]').forEach(btn => {
      const liked = likedIds.has(id), n = likeCounts[id] || 0;
      btn.classList.toggle('liked', liked);
      btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
      btn.setAttribute('aria-label', (liked ? 'You liked this. ' : 'Like this find. ') + n + (n === 1 ? ' like' : ' likes'));
      btn.querySelector('.n').textContent = n > 0 ? n : (liked ? '' : 'Like');
    });
  }

  function makeLikeButton(find){
    const id = find.documentId;
    if(!(id in likeCounts)) likeCounts[id] = Number(find.likes) || 0;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'like'; btn.dataset.id = id;
    btn.innerHTML = HEART + '<span class="n"></span>';
    btn.addEventListener('click', () => sendLike(id));
    queueMicrotask(() => paintLike(id));
    return btn;
  }

  async function sendLike(id){
    if(likedIds.has(id)) return;
    // Optimistic: show the like straight away, undo if the server says no.
    likedIds.add(id); likeCounts[id] = (likeCounts[id] || 0) + 1;
    store('ppp_liked', JSON.stringify([...likedIds]));
    paintLike(id);
    document.querySelectorAll('.like[data-id="' + id + '"]').forEach(b => { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
    try{
      const res = await fetch(STRAPI_URL + '/api/finds/' + encodeURIComponent(id) + '/like?voter=' + encodeURIComponent(voterId()), { method: 'POST' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if(typeof json.likes === 'number') likeCounts[id] = json.likes;
      paintLike(id);
    }catch(err){
      console.error(err);
      likedIds.delete(id); likeCounts[id] = Math.max(0, (likeCounts[id] || 1) - 1);
      store('ppp_liked', JSON.stringify([...likedIds]));
      paintLike(id);
      document.querySelectorAll('.like[data-id="' + id + '"]').forEach(b => { b.title = "Couldn't save that like. Try again in a moment."; });
    }
  }

  /* ---------------------------------------------------------------
     Photo of the Week / Month spotlight.
     The server decides (your manual pick if set, else most-liked).
  --------------------------------------------------------------- */
  const spotlight = document.getElementById('spotlight');
  const spotCard = document.getElementById('spotCard');
  const spotBadge = document.getElementById('spotBadge');
  const spotTabs = document.getElementById('spotTabs');
  const spotData = {};

  function showSpot(period){
    const find = spotData[period];
    if(!find) return;
    spotBadge.textContent = '🏆 Photo of the ' + (period === 'month' ? 'Month' : 'Week');
    spotTabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.period === period));
    spotCard.replaceChildren(makeCard(find));
  }

  async function loadSpotlight(){
    try{
      const get = p => fetch(STRAPI_URL + '/api/finds/featured?period=' + p)
        .then(r => r.ok ? r.json() : null).then(j => (j && j.data) || null).catch(() => null);
      const [week, month] = await Promise.all([get('week'), get('month')]);
      spotData.week = week; spotData.month = month;
      if(!week && !month) return;           // nothing to feature yet: stay hidden
      spotlight.hidden = false;
      spotTabs.hidden = !(week && month);   // only offer the toggle if both exist
      showSpot(week ? 'week' : 'month');
    }catch(err){ console.error(err); }
  }
  spotTabs.addEventListener('click', e => {
    const b = e.target.closest('button[data-period]');
    if(b) showSpot(b.dataset.period);
  });

  async function loadFeed(){
    setState('Loading the latest finds…');
    try{
      // populate[photo][populate]=* fully expands the photo media (url + formats),
      // which a bare populate=photo does not reliably do in Strapi v5.
      const url = STRAPI_URL +
        '/api/finds?status=published&populate[photo][populate]=*&sort=publishedAt:desc&pagination[pageSize]=50';
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const finds = json.data || [];
      if(!finds.length){ setState('No finds published yet. Add one in Strapi, hit Publish, and refresh.'); return; }
      clearState();
      feed.innerHTML = '';
      finds.forEach(f => feed.appendChild(makeCard(f)));
    }catch(err){
      console.error(err);
      setState("Couldn't reach Strapi. Check it's running, that STRAPI_URL is correct, and that CORS allows this page.", true);
    }
  }

  loadFeed();
  loadSpotlight();
</script>

</html>
